# script for the WCH CH579 (Cortex-M0, SWD only)
#
# The 2-wire debug interface has to be enabled in the configuration of the
# chip first, e.g. with WCHISPStudio. After power on the chip runs its boot
# loader, which is mapped at 0 instead of the code flash; a reset by
# SYSRESETREQ starts the application with the code flash at 0, so reset the
# target before reading the flash ("program" does it).

source [find target/swj-dp.tcl]

if { [info exists CHIPNAME] } {
   set _CHIPNAME $CHIPNAME
} else {
   set _CHIPNAME ch579
}

# Work-area is a space in RAM used for flash programming
if { [info exists WORKAREASIZE] } {
   set _WORKAREASIZE $WORKAREASIZE
} else {
   set _WORKAREASIZE 0x2000
}

if { [info exists CPUTAPID] } {
   set _CPUTAPID $CPUTAPID
} else {
   set _CPUTAPID 0x0bb11477
}

swj_newdap $_CHIPNAME cpu -expected-id $_CPUTAPID
dap create $_CHIPNAME.dap -tap $_CHIPNAME.cpu

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -dap $_CHIPNAME.dap

$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size $_WORKAREASIZE -work-area-backup 0

# code flash at 0 and data flash, the sizes are probed
flash bank $_CHIPNAME.flash ch579 0x00000000 0 0 0 $_TARGETNAME
flash bank $_CHIPNAME.dflash ch579 0x0003E800 0 0 0 $_TARGETNAME

# a sector erase stalls the bus for about 2 ms, the probe has to retry long
# enough on WAIT
adapter speed 10000

# the manual reset input is disabled by default, reset the chip by SYSRESETREQ
cortex_m reset_config sysresetreq

# The system clock is 6.4 MHz after reset. Run it directly from the 32 MHz
# oscillator, as SetSysClock(CLK_SOURCE_HSI_32MHz) of the WCH SDK does, to
# speed up the flash loader and the checksum of verify. The clock register
# can only be written in the safe access mode, which lasts a few clock cycles
# only, so a small code in RAM does it:
#	ldr	r1, =0x40001040		@ R8_SAFE_ACCESS_SIG
#	ldr	r3, =0x40001008		@ R16_CLK_SYS_CFG
#	movs	r2, #0x57
#	strb	r2, [r1]
#	movs	r2, #0xa8
#	strb	r2, [r1]
#	movs	r2, #0x88		@ 32 MHz directly
#	strh	r2, [r3]
#	movs	r2, #0
#	strb	r2, [r1]
#	bkpt	#0
proc ch579_clock_32mhz {} {
	set regs [get_reg {pc xpsr msp}]
	write_memory 0x20000000 32 {0x4b064905 0x700a2257 0x700a22a8 0x801a2288 0x700a2200 0x0000be00 0x40001040 0x40001008}
	set_reg {pc 0x20000000 xpsr 0x01000000}
	resume
	wait_halt 100
	set_reg $regs
}

$_TARGETNAME configure -event reset-init {
	ch579_clock_32mhz
}
