#
# Infineon XMC7000 family (ARM Cortex-M0+ + Cortex-M7 @ up to 350 MHz)
#
# All parts have 1x CM0+ (AP1). The "D" suffix denotes the dual-core option;
# the number of CM7 cores follows the part number:
#   no "D"  (XMC7100,  XMC7200)  - single-core: 1x CM7_0 (AP2)
#   "D"     (XMC7100D, XMC7200D) - dual-core:   2x CM7   (AP2, AP3)
# (e.g. XMC7100D-F144K4160, silicon ID 0x1E94C069, is a dual-core part.)
#
# The default below assumes a dual-core ("D") part. For a single-core part,
# override with NUM_CM7 = 1.
#
# Usage:
#   openocd -f interface/... -f target/xmc7xxx.cfg
#   Override defaults via -c "set CHIPNAME xmc7200; set NUM_CM7 1" before -f
#

if { [info exists CHIPNAME] } {
	set _CHIPNAME $CHIPNAME
} else {
	set _CHIPNAME xmc7100
}

# Number of CM7 cores: 1 for single-core parts, 2 for "D"-suffix dual-core parts
if { [info exists NUM_CM7] } {
	set _NUM_CM7 $NUM_CM7
} else {
	set _NUM_CM7 2
}

source [find target/swj-dp.tcl]

# Record the reset mode so the reset-deassert-post handler knows whether a
# halt was requested. SYSRESETREQ resets the debug domain on XMC7000, which
# clears the cortex_m reset vector catch, so "reset halt"/"reset init" cannot
# rely on it; instead the core is halted explicitly after reset (below).
proc init_reset { mode } {
	global RESET_MODE
	set RESET_MODE $mode
	if { [using_jtag] } {
		jtag arp_init-reset
	}
}

# Re-synchronise and (for halt-type resets) halt the core after reset.
proc xmc7xxx_deassert_post { target } {
	# The system reset clears the AP registers (including TAR); re-examine to
	# resync OpenOCD's view of the core.
	catch { $target arp_examine }

	global RESET_MODE
	if { $RESET_MODE ne "run" } {
		catch { $target arp_poll }
		catch { $target arp_poll }
		set st [$target curstate]
		if { $st eq "reset" } {
			catch { $target arp_waitstate running 100 }
		}
		if { [$target curstate] ne "halted" } {
			catch { $target arp_halt }
			catch { $target arp_waitstate halted 300 }
		}
	}
}

#
# SWJ-DP
#
if { [info exists CPU_JTAG_TAPID] } {
	set _CPU_JTAG_TAPID $CPU_JTAG_TAPID
} else {
	set _CPU_JTAG_TAPID 0x6BA00477
}

# Cypress/Infineon system access TAP present in the JTAG chain
if { [info exists SYSAP_JTAG_TAPID] } {
	set _SYSAP_JTAG_TAPID $SYSAP_JTAG_TAPID
} else {
	set _SYSAP_JTAG_TAPID 0x1E94C069
}

#
# SW-DP
#
if { [info exists CPU_SWD_TAPID] } {
	set _CPU_SWD_TAPID $CPU_SWD_TAPID
} else {
	set _CPU_SWD_TAPID 0x6BA02477
}

if { [using_jtag] } {
	swj_newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf \
		-expected-id $_CPU_JTAG_TAPID
	jtag newtap $_CHIPNAME sysap -irlen 4 -expected-id $_SYSAP_JTAG_TAPID
} else {
	swj_newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf \
		-expected-id $_CPU_SWD_TAPID
}

dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

# Work-area size for CM0+ core (default 16 kB)
if { [info exists WORKAREASIZE_CM0] } {
	set _WORKAREASIZE_CM0 $WORKAREASIZE_CM0
} else {
	set _WORKAREASIZE_CM0 0x4000
}

# Work-area size for CM7 cores (default 32 kB)
if { [info exists WORKAREASIZE_CM7] } {
	set _WORKAREASIZE_CM7 $WORKAREASIZE_CM7
} else {
	set _WORKAREASIZE_CM7 0x8000
}

# Code/Work flash sizes (bytes). Defaults match the 4160 kB / 256 kB part.
# Override via -c "set MFLASH_SIZE 0x210000; set WFLASH_SIZE 0x20000" for smaller parts.
if { ![info exists MFLASH_SIZE] } { set MFLASH_SIZE 0x410000 }
if { ![info exists WFLASH_SIZE] } { set WFLASH_SIZE 0x40000 }

# CM0+ core at AP 1
# SRAM base is 0x28000000; the first 32 kB (0x28000000-0x28007fff) is reserved by
# the boot ROM / SROM firmware, so the work area (used as the SROM scratch buffer
# and to host the CM0+ helper loop) is placed above it.
target create $_CHIPNAME.cm0 cortex_m -dap $_CHIPNAME.dap -ap-num 1
$_CHIPNAME.cm0 configure -work-area-phys 0x28008000 -work-area-size $_WORKAREASIZE_CM0 -work-area-backup 0
$_CHIPNAME.cm0 cortex_m reset_config sysresetreq
$_CHIPNAME.cm0 configure -event reset-deassert-post "xmc7xxx_deassert_post $_CHIPNAME.cm0"

# CM7_0 core at AP 2 — held in reset until CM0+ releases it
target create $_CHIPNAME.cm7_0 cortex_m -dap $_CHIPNAME.dap -ap-num 2 -defer-examine
$_CHIPNAME.cm7_0 configure -work-area-phys 0x28040000 -work-area-size $_WORKAREASIZE_CM7 -work-area-backup 0
$_CHIPNAME.cm7_0 configure -event reset-assert { }
$_CHIPNAME.cm7_0 configure -event reset-deassert-post { }

# CM7_1 core at AP 3 (XMC7200 only)
if { $_NUM_CM7 > 1 } {
	target create $_CHIPNAME.cm7_1 cortex_m -dap $_CHIPNAME.dap -ap-num 3 -defer-examine
	$_CHIPNAME.cm7_1 configure -work-area-phys 0x28060000 -work-area-size $_WORKAREASIZE_CM7 -work-area-backup 0
	$_CHIPNAME.cm7_1 configure -event reset-assert { }
	$_CHIPNAME.cm7_1 configure -event reset-deassert-post { }
}

# Flash banks. The xmc7xxx driver programs flash via the SROM system-call API
# (IPC structure 3), running a small helper loop on CM0+ to service the calls.
flash bank $_CHIPNAME.mflash xmc7xxx 0x10000000 $MFLASH_SIZE 0 0 $_CHIPNAME.cm0
flash bank $_CHIPNAME.wflash xmc7xxx 0x14000000 $WFLASH_SIZE 0 0 $_CHIPNAME.cm0

# Use CM0+ as default target
targets $_CHIPNAME.cm0

adapter speed 1000
