# script for stm32c5x family

#
# stm32c5 devices support both JTAG and SWD transports.
#

source [find target/swj-dp.tcl]
source [find mem_helper.tcl]

set PSTATE_OPEN				0xED
set PSTATE_PROVISIONING		0x17
set PSTATE_IROT_PROVISIONED	0x2E
set PSTATE_CLOSED			0x72
set PSTATE_LOCKED			0x5C
set PSTATE_REGRESSION		0x9A

if { [info exists CHIPNAME] } {
	set _CHIPNAME $CHIPNAME
} else {
	set _CHIPNAME stm32c5x
}

if { [info exists ENABLE_LOW_POWER] } {
	set _ENABLE_LOW_POWER $ENABLE_LOW_POWER
} else {
	set _ENABLE_LOW_POWER 0
}

if { [info exists STOP_WATCHDOG] } {
	set _STOP_WATCHDOG $STOP_WATCHDOG
} else {
	set _STOP_WATCHDOG 0
}

set _ENDIAN little

# Work-area is a space in RAM used for flash programming
# By default use 16kB at address 0x20000000
if { [info exists WORKAREASIZE] } {
	set _WORKAREASIZE $WORKAREASIZE
} else {
	set _WORKAREASIZE 0x4000
}

if { [info exists WORKAREAADDR] } {
	set _WORKAREAADDR $WORKAREAADDR
} else {
	set _WORKAREAADDR 0x20000000
}

#jtag scan chain
if { [info exists CPUTAPID] } {
	set _CPUTAPID $CPUTAPID
} else {
	if { [using_jtag] } {
		# Corresponds to Cortex(R)-M33 JTAG debug port ID code
		set _CPUTAPID 0x0ba04477
	} {
		# SWD IDCODE (single drop, arm).
		# STM32C552 silicon reports 0x6ba02477, accept the generic
		# Cortex-M33 SW-DP ID as well.
		set _CPUTAPID 0x6ba02477
	}
}

swj_newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $_CPUTAPID
set _TARGETNAME $_CHIPNAME.cpu

dap create $_CHIPNAME.dap -chain-position $_TARGETNAME

if {[using_jtag]} {
	jtag newtap $_CHIPNAME bs -irlen 5
}

target create $_CHIPNAME.ap0 mem_ap -endian $_ENDIAN -dap $_CHIPNAME.dap -ap-num 0
target create $_TARGETNAME cortex_m -endian $_ENDIAN -dap $_CHIPNAME.dap -ap-num 1 -gdb-max-connections 2

$_TARGETNAME configure -work-area-phys $_WORKAREAADDR -work-area-size $_WORKAREASIZE -work-area-backup 0

# flash size will be probed
flash bank $_CHIPNAME.flash stm32c5x 0x08000000 0 0 0 $_TARGETNAME

if { [info exists CLOCK_FREQ] } {
	set _CLOCK_FREQ $CLOCK_FREQ
} else {
	set _CLOCK_FREQ 4000
}
adapter speed $_CLOCK_FREQ

adapter srst delay 100
if {[using_jtag]} {
	jtag_ntrst_delay 100
}

if {[using_hla]} {
	echo "Error : The selected transport does not support debugging this device"
	shutdown
} else {
	# if srst is not fitted use SYSRESETREQ to
	# perform a soft reset
	cortex_m reset_config sysresetreq
}

proc stm32c5x_is_secure {} {
	# read Debug Security Control and Status Register (DSCSR) and check CDS (bit 16)
	set DSCSR [mrw 0xE000EE08]
	return [expr {($DSCSR & (1 << 16)) != 0}]
}

proc stm32c5x_ahb_ap_non_secure_access {} {
	# SPROT=1=Non Secure access, Priv=1
	[[target current] cget -dap] apcsw 0x4B000000 0x4F000000
}

proc stm32c5x_ahb_ap_secure_access {} {
	# SPROT=0=Secure access, Priv=1
	[[target current] cget -dap] apcsw 0x0B000000 0x4F000000
}

# get _CHIPNAME from current target
proc stm32c5x_get_chipname {} {
	set t [target current]
	set sep [string last "." $t]
	if {$sep == -1} {
		return $t
	}
	return [string range $t 0 [expr {$sep - 1}]]
}

# like mrw, but with target selection
proc stm32c5x_mrw {used_target reg} {
	return [$used_target read_memory $reg 32 1]
}

# like mmw, but with target selection
proc stm32c5x_mmw {used_target reg setbits clearbits} {
	set old [stm32c5x_mrw $used_target $reg]
	set new [expr {($old & ~$clearbits) | $setbits}]
	$used_target mww $reg $new
}

proc stm32c5x_enter_debug {} {
	set _CHIPNAME [stm32c5x_get_chipname]

	# check security status
	set secure [stm32c5x_is_secure]

	if {$secure} {
		stm32c5x_ahb_ap_secure_access
	} else {
		stm32c5x_ahb_ap_non_secure_access
	}

	# print the secure state only when it changes
	global $_CHIPNAME.secure
	set initialized [info exists $_CHIPNAME.secure]

	if {!$initialized || $secure != [set $_CHIPNAME.secure]} {
		# update saved security state
		set $_CHIPNAME.secure $secure

		set secure_str [expr {$secure ? "Secure" : "Non-Secure"}]
		echo "$_CHIPNAME.cpu in $secure_str state"
	}

	# check flash options, from OPTSR_CUR register
	set optsr [mrw 0x40022050]

	# avoid some noise, when reset is asserted OPTSR register is read as zero
	if {$optsr == 0} { return }

	# read product state
	set pstate [expr {($optsr >> 8) & 0xFF}]

	global PSTATE_OPEN

	# ensure that workarea is correctly configured if pstate changed
	global $_CHIPNAME.pstate
	if { [info exists $_CHIPNAME.pstate] && $pstate == [set $_CHIPNAME.pstate] } {
		return
	}

	set $_CHIPNAME.pstate $pstate

	# when the device is not in the Open product state the RAM is not
	# accessible, disable the work-area so the flash driver falls back to
	# programming without a loader
	global $_CHIPNAME.workarea_size
	if {![info exists $_CHIPNAME.workarea_size]} {
		set $_CHIPNAME.workarea_size [$_CHIPNAME.cpu cget -work-area-size]
	}

	if {$pstate != $PSTATE_OPEN} {
		set workarea_size 0
		echo "$_CHIPNAME.cpu work-area is disabled"
	} else {
		set workarea_size [set $_CHIPNAME.workarea_size]
		echo "$_CHIPNAME.cpu work-area is enabled"
	}

	$_CHIPNAME.cpu configure -work-area-size $workarea_size
}

$_TARGETNAME configure -event reset-init {
	global _CLOCK_FREQ
	adapter speed $_CLOCK_FREQ
}

$_CHIPNAME.ap0 configure -event examine-end {
	set _CHIPNAME [stm32c5x_get_chipname]

	# Enable Trace Port and Clock (uses more power)
	# DBGMCU_CR |= TRACE_EN
	stm32c5x_mmw $_CHIPNAME.ap0 0xE00E4004 0x00000020 0
}

$_TARGETNAME configure -event examine-end {
	global _ENABLE_LOW_POWER
	global _STOP_WATCHDOG

	stm32c5x_enter_debug

	set _CHIPNAME [stm32c5x_get_chipname]

	if { $_ENABLE_LOW_POWER == 1 } {
		# Enable debug during low power modes (uses more power)
		# DBGMCU_CR |= DBG_STANDBY | DBG_STOP | DBG_SLEEP
		stm32c5x_mmw $_CHIPNAME.ap0 0xE00E4004 0x00000007 0
	} else {
		# Disable debug during low power modes
		# DBGMCU_CR &= ~(DBG_STANDBY | DBG_STOP | DBG_SLEEP)
		stm32c5x_mmw $_CHIPNAME.ap0 0xE00E4004 0 0x00000007
	}

	if { $_STOP_WATCHDOG == 1 } {
		# Stop watchdog counters during halt
		# DBGMCU_APB1_FZ |= DBG_IWDG_STOP | DBG_WWDG_STOP
		stm32c5x_mmw $_CHIPNAME.ap0 0xE00E4008 0x00001800 0
	} else {
		# Don't stop watchdog counters during halt
		# DBGMCU_APB1_FZ &= ~(DBG_IWDG_STOP | DBG_WWDG_STOP)
		stm32c5x_mmw $_CHIPNAME.ap0 0xE00E4008 0 0x00001800
	}
}

$_TARGETNAME configure -event halted {
	stm32c5x_enter_debug
}
