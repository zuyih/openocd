# Infineon AURIX TC4Dx (TriCore 1.8, 6 cores, 20 MB PFLASH)
#
# Debugged through the TAS transport, i.e. an Infineon DAS/TAS server has to be
# running and connected to the device. Start OpenOCD with interface/tas_client.cfg.

source [find target/infineon/aurix.cfg]

# What a TC4x image may carry besides program flash, from the iLLD TC4Dx flash
# configuration. The addresses differ from the TC3xx ones, so each device
# declares its own.
set AURIX_REGIONS {
	{0xAE000000 0xAE03FFFF "data flash"}
	{0xAE400000 0xAE413FFF "UCB, boot mode headers and protection"}
}

if { [info exists CHIPNAME] } {
	set _CHIPNAME $CHIPNAME
} else {
	set _CHIPNAME tc4dx
}

# IEEE 1149.1 device ID as reported by the TAS server. Both the initial and the
# A step are accepted.
if { [info exists OCDS_TAPID] } {
	set _OCDS_TAPID $OCDS_TAPID
	tas newtap $_CHIPNAME ocds -irlen 8 -expected-id $_OCDS_TAPID
} else {
	tas newtap $_CHIPNAME ocds -irlen 8 \
		-expected-id 0x00225083 -expected-id 0x10225083
}

# With several devices of the same type attached, DEVICE picks one out by a
# substring of the identifier the TAS server reports for it.
if { [info exists DEVICE] } {
	ocds create tc4dx -chain-position $_CHIPNAME.ocds -device $DEVICE
} else {
	ocds create tc4dx -chain-position $_CHIPNAME.ocds
}

# TriCore cores. CSFR windows sit at 0xF8810000 + 0x40000 * coreid; the aurix
# target resolves that from the device type reported over TAS.
target create $_CHIPNAME.cpu0 aurix -coreid 0 -ocds tc4dx
target create $_CHIPNAME.cpu1 aurix -coreid 1 -ocds tc4dx
target create $_CHIPNAME.cpu2 aurix -coreid 2 -ocds tc4dx
target create $_CHIPNAME.cpu3 aurix -coreid 3 -ocds tc4dx
target create $_CHIPNAME.cpu4 aurix -coreid 4 -ocds tc4dx
target create $_CHIPNAME.cpu5 aurix -coreid 5 -ocds tc4dx

# PFLASH banks, cached addresses. Sizes taken from the TC4Dx memory map:
# PF0 4M, PF1 4M, PF2 2M, PF3 4M, PF4 4M, PF5 2M -- 20 MB in total.
flash bank pfls0 tc4xx 0x80000000 0x400000 0 0 $_CHIPNAME.cpu0
flash bank pfls1 tc4xx 0x80400000 0x400000 0 0 $_CHIPNAME.cpu0
flash bank pfls2 tc4xx 0x80800000 0x200000 0 0 $_CHIPNAME.cpu0
flash bank pfls3 tc4xx 0x80A00000 0x400000 0 0 $_CHIPNAME.cpu0
flash bank pfls4 tc4xx 0x80E00000 0x400000 0 0 $_CHIPNAME.cpu0
flash bank pfls5 tc4xx 0x81200000 0x200000 0 0 $_CHIPNAME.cpu0

targets $_CHIPNAME.cpu0
