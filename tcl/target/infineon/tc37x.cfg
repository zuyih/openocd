source [find target/infineon/aurix.cfg]

# What a TC3xx image may carry besides program flash, from the TC3xx memory
# map. Naming these makes a skipped range recognisable in the log.
set AURIX_REGIONS {
	{0xAF000000 0xAF03FFFF "data flash"}
	{0xAF400000 0xAF405FFF "UCB, boot mode headers and protection"}
	{0xAF800000 0xAF80FFFF "configuration sector"}
	{0xAFC00000 0xAFC1FFFF "HSM data flash"}
}

if { [info exists CHIPNAME] } {
	set _CHIPNAME $CHIPNAME
} else {
	set _CHIPNAME tc37x
}

# IEEE 1149.1 device ID as reported by the TAS server. Both the initial and the
# A step are accepted.
if { [info exists OCDS_TAPID] } {
	set _OCDS_TAPID $OCDS_TAPID
	tas newtap $_CHIPNAME ocds -irlen 8 -expected-id $_OCDS_TAPID
} else {
	tas newtap $_CHIPNAME ocds -irlen 8 \
		-expected-id 0x00207083 -expected-id 0x10207083
}

# With several devices of the same type attached, DEVICE picks one out by a
# substring of the identifier the TAS server reports for it.
if { [info exists DEVICE] } {
	ocds create tc3xx -chain-position $_CHIPNAME.ocds -device $DEVICE
} else {
	ocds create tc3xx -chain-position $_CHIPNAME.ocds
}

# Create targets
target create $_CHIPNAME.cpu0 aurix -coreid 0 -ocds tc3xx
target create $_CHIPNAME.cpu1 aurix -coreid 1 -ocds tc3xx
target create $_CHIPNAME.cpu2 aurix -coreid 2 -ocds tc3xx

# PFLASH banks, cached addresses. Both belong to core 0: a bank is only found
# for the core it is attached to, so putting one on core 1 would make it
# unreachable while programming through core 0, and core 1 comes out of reset
# in boot halt and cannot run the flash loader anyway.
# The trailing number is the program flash bank, which the protection state is
# looked up by; the driver cannot tell from the base address alone.
flash bank pfls0 tc3xx 0x80000000 0x300000 0 0 $_CHIPNAME.cpu0 0
flash bank pfls1 tc3xx 0x80300000 0x300000 0 0 $_CHIPNAME.cpu0 1

targets $_CHIPNAME.cpu0