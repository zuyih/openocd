# RT-Thread ART-Pi2, an STM32H7R7L8 with two memories on the XSPI controllers:
#
#   XSPI2 -- W35T51NWTBIE, a 512 Mbit octal NOR flash, mapped at 0x70000000
#   XSPI1 -- APS256XX, a 256 Mbit octal PSRAM, mapped at 0x90000000
#
# The application lives in the octal flash and is executed in place. The 64 KB
# internal flash at 0x08000000 holds the boot loader that brings XSPI2 up and
# hands over to it.

# The onboard probe is an ST-LINK, but the debug connector is there to be used
# with something else, so only reach for it if nothing has been chosen already.
# Selecting the transport stays unconditional: the board speaks SWD whatever is
# driving it, and saying so again once it is selected costs nothing.
if { [adapter name] eq "undefined" } {
	source [find interface/stlink.cfg]
}

transport select swd

source [find target/stm32h7rsx.cfg]

reset_config srst_only

# Reaching the octal flash means driving the XSPI, and which pins it uses and
# how the chip is talked into octal DTR are properties of the board and of the
# chip, not of the part. OpenOCD has no driver for either, so programming it
# goes through the external loader the RT-Thread BSP ships, a copy of which is
# under loaders/stldr. EXTERNAL_LOADER names another one instead.
#
# The loader carries its own geometry, so only the base address is stated here
# and the size is left for it to fill in.
if { ![info exists EXTERNAL_LOADER] } {
	set EXTERNAL_LOADER [find loaders/stldr/ART-Pi2_ST_winbond_64MB.stldr]
}

flash bank $_CHIPNAME.extflash stldr 0x70000000 0 0 0 $_CHIPNAME.cpu0 $EXTERNAL_LOADER
