# Infineon KIT_A3G_TC4D7_LITE (AURIX TC4D7 Lite Kit)
#
# The on-board debugger is reached through an Infineon DAS/TAS server, not
# directly over USB. Start the server first; set a different address with
#   tas_client host <ipv4>
# before sourcing this file if it does not run on localhost.

source [find interface/tas_client.cfg]

reset_config srst_only srst_nogate connect_assert_srst

set CHIPNAME tc4d7
source [find target/infineon/tc4dx.cfg]
