# Infineon KIT_A3G_TC4D7_LITE (AURIX TC4D7 Lite Kit)
#
# The on-board debugger is reached through an Infineon DAS/TAS server, not
# directly over USB. Start the server first; set a different one with
#   tas-client host <host> [port]
# after sourcing this file if it does not run on localhost.

source [find interface/tas_client.cfg]

reset_config srst_only srst_nogate connect_assert_srst
adapter speed 5000

set CHIPNAME tc4d7
source [find target/infineon/tc4dx.cfg]
