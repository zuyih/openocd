# ALIENTEK ATK-CNN647B, an STM32N647X0 core board carrying a MX25UM25645G
# octal NOR flash, 32 MB mapped at 0x70000000. It is usually seen on the
# ATK-DNN647 base board, which brings out connectors and nothing that this
# has to know about: the part, the flash and the pins between them are all on
# the core board, so the same configuration holds whatever it is plugged into.
#
# An STM32N6 has no internal flash at all. It boots from the octal flash, so
# that bank is the only thing there is to program.

# The core board has no probe of its own, but leave an adapter alone if one
# has already been chosen. Selecting the transport stays unconditional: the
# board speaks SWD whatever is driving it, and saying so again once it is
# selected costs nothing.
if { [adapter name] eq "undefined" } {
	source [find interface/stlink.cfg]
}

transport select swd

source [find target/stm32n6x.cfg]

reset_config srst_only

# Driving the XSPI, and talking the chip into octal DTR, belong to the board
# and to the chip rather than to the part, and OpenOCD has a driver for
# neither. So the bank goes through the external loader that came with the
# board, a copy of which is under loaders/stldr.
#
# target/stm32n6x.cfg has already made a bank of every entry in FLASH_LOADERS,
# should any have been given; name the bank here in the other case, so that it
# ends up called something shorter than the path to the file. The loader
# carries its own geometry, so only the base address is stated.
#
# Either way, remember what the bank ended up called. The procedures below have
# to name it, and a number would only be right on a part with no flash of its
# own for the target configuration to have declared first.
if { ![info exists FLASH_LOADERS] } {
	flash bank $_CHIPNAME.extflash stldr 0x70000000 0 0 0 $_TARGETNAME \
		[find loaders/stldr/MX25UM25645G_ATK-CNN647B_ExtMemLoader.stldr]
	set ATK_CNN647B_BANK $_CHIPNAME.extflash
} else {
	set ATK_CNN647B_BANK [lindex $FLASH_LOADERS 0]
}

# Two things about the boot ROM are worth knowing before wondering why a
# board that programmed cleanly does nothing afterwards.
#
# BOOT1 has to be high to get here at all. That is what selects development
# boot, where the boot ROM waits for a debugger instead of starting an image,
# and it is the only state in which the flash can be reached this way. The
# board will not run what was just written until BOOT1 goes back down and it
# is reset: the boot ROM decides from the pins and nothing else, and ST say
# that decision is not reachable from software, so there is no command to end
# a programming session with that would take its place.
#
# An image the boot ROM will accept is one that has been through
# STM32_SigningTool_CLI. What is written here is passed through untouched, so
# a plain binary lands in the flash exactly as given and is then refused at
# boot, BOOT1 notwithstanding.

# Start what BOOT1 low would have started.
#
# Left to itself the boot ROM reads the image at the start of the octal flash
# into its download buffer and enters it. In development boot it does none of
# that and waits for a debugger instead, so do it by hand.
#
# The layout is UM3234's. Table 32 puts the image length at 0x6c, the entry
# point at 0x70 and the length of the extension headers at 0x88, the base
# header itself being 0xa0 long. Figure 4 puts the download buffer at
# 0x34180000 and the code within it at 0x34180240, which is exactly where 0xa0
# plus those extension headers lands. So put the image at the foot of the
# buffer and everything inside it falls where the boot ROM would have had it,
# whatever the signing tool padded it out to.

# Take a copy of the image, mapping the flash first if nothing else has.
#
# Which is the point of doing this before the reset rather than after: an
# operation on the bank leaves the mapping behind and a reset takes it away, so
# on the way out of "program ... verify reset" the mapping is there for the
# asking, where afterwards it would cost putting the loader back in RAM and
# running Init again -- the best part of a second, every time.
proc atk_cnn647b_image {} {
	global ATK_CNN647B_BANK

	set base 0x70000000

	if {![stm32n6x_xspi_mapped 2]} {
		halt
		stldr init $ATK_CNN647B_BANK
	}

	if {[read_memory $base 32 1] != 0x324d5453} {
		error "no STM32 image header at [format 0x%08x $base]"
	}
	set size  [read_memory [expr {$base + 0x6c}] 32 1]
	set entry [read_memory [expr {$base + 0x70}] 32 1]
	set load  [read_memory [expr {$base + 0x78}] 32 1]
	set post  [read_memory [expr {$base + 0x88}] 32 1]

	# An image that asks to be put somewhere else is one the boot ROM would
	# have relocated. Nothing here does that, so say so rather than run it
	# from the wrong address.
	if {$load != 0xffffffff} {
		error [format "image wants loading at 0x%08x, which this does not do" $load]
	}

	set total [expr {0xa0 + $post + $size}]
	echo [format "boot: %d bytes to 0x34180000, entering at 0x%08x" $total $entry]

	return [list $entry [read_memory $base 32 [expr {($total + 3) / 4}]]]
}

# Hand over to an image read by the above, the core halted out of a reset. It
# is entered as though from one and finds the hardware as the reset left it;
# entered with the loader's leavings still around it takes a precise bus fault
# at 0x59 -- a handle it expected to set up itself -- before it reaches main.
proc atk_cnn647b_start {image} {
	# UM3234 figure 4. AXI-SRAM2 ends at 0x341fffff.
	write_memory 0x34180000 32 [lindex $image 1]

	reg sp 0x34200000
	reg pc [expr {[lindex $image 0] & ~1}]
	resume
}

proc atk_cnn647b_boot {} {
	set image [atk_cnn647b_image]
	reset halt
	atk_cnn647b_start $image
}

# Starting the image is what "reset run" means on a board that has one, and in
# development boot nothing else will do it. So do it there, and the usual
# "program ... verify reset" leaves the board running what it wrote, with
# nothing more asked of whoever is running it.
#
# The reset command cannot be taken over where this is read, since it is not
# registered until init, and a reset-end handler cannot do it either: starting
# the image involves resetting again, and Tcl will not have reset invoked from
# inside itself. Taking over init, and from there reset, leaves the work
# standing after the original command has returned, where resetting is allowed.
rename init atk_cnn647b_init_orig

proc atk_cnn647b_reset {args} {
	global ATK_CNN647B_BOOT1

	# Only a reset that runs; the ones done to start an image halt instead.
	set booting [expr {![llength $args] || [lindex $args 0] eq "run"}]

	# A pin does not move between one reset and the next, so what it said last
	# time answers for this one. Which is worth remembering: with Boot1 low
	# there is nothing to do here, and finding that out below happens after the
	# image has been read out for nothing.
	if {$booting && [info exists ATK_CNN647B_BOOT1] && !$ATK_CNN647B_BOOT1} {
		set booting 0
	}

	# Take the copy now if the bank is mapped, which it is on the way out of an
	# operation on it -- the case this is all for. Stop the core first: reading
	# 45 KB out from under something that is still running invites it to
	# reconfigure the controller halfway through, and the reset below was going
	# to stop it anyway.
	set image {}
	if {$booting} {
		if {[catch {
			halt
			if {[stm32n6x_xspi_mapped 2]} {
				set image [atk_cnn647b_image]
			}
		} msg]} {
			echo "boot: $msg"
			set booting 0
		}
	}

	atk_cnn647b_reset_orig {*}$args

	if {!$booting} {
		return
	}

	# And only when the boot ROM is not going to do it anyway: with Boot1 low
	# it has started the image already. Asking now rather than before the reset
	# is what makes the answer readable, SYSCFG being clocked by then.
	set ATK_CNN647B_BOOT1 [stm32n6x_boot1]
	if {!$ATK_CNN647B_BOOT1} {
		return
	}

	if {![llength $image]} {
		if {[catch {set image [atk_cnn647b_image]} msg]} {
			echo "boot: $msg"
			return
		}
	}

	halt
	atk_cnn647b_start $image
}

proc init {args} {
	atk_cnn647b_init_orig {*}$args

	if {![llength [info commands atk_cnn647b_reset_orig]]} {
		rename reset atk_cnn647b_reset_orig
		rename atk_cnn647b_reset reset
	}
}
