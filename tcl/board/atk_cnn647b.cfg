# ALIENTEK ATK-CNN647B, an STM32N647X0 core board carrying a MX25UM25645G
# octal NOR flash, 32 MB mapped at 0x70000000. It is usually seen on the
# ATK-DNN647 base board, which brings out connectors and nothing that this
# has to know about: the part, the flash and the pins between them are all on
# the core board, so the same configuration holds whatever it is plugged into.
#
# An STM32N6 has no internal flash at all. It boots from the octal flash, so
# that bank is the only thing there is to program.

# The core board has no probe of its own, but leave an adapter alone if one
# has already been chosen. Selecting the transport stays unconditional: the
# board speaks SWD whatever is driving it, and saying so again once it is
# selected costs nothing.
if { [adapter name] eq "undefined" } {
	source [find interface/stlink.cfg]
}

transport select swd

source [find target/stm32n6x.cfg]

reset_config srst_only

# Driving the XSPI, and talking the chip into octal DTR, belong to the board
# and to the chip rather than to the part, and OpenOCD has a driver for
# neither. So the bank goes through the external loader that came with the
# board, a copy of which is under loaders/stldr.
#
# target/stm32n6x.cfg has already made a bank of every entry in FLASH_LOADERS,
# should any have been given; name the bank here in the other case, so that it
# ends up called something shorter than the path to the file. The loader
# carries its own geometry, so only the base address is stated.
if { ![info exists FLASH_LOADERS] } {
	flash bank $_CHIPNAME.extflash stldr 0x70000000 0 0 0 $_TARGETNAME \
		[find loaders/stldr/MX25UM25645G_ATK-CNN647B_ExtMemLoader.stldr]
}

# Two things about the boot ROM are worth knowing before wondering why a
# board that programmed cleanly does nothing afterwards.
#
# BOOT1 has to be high to get here at all. That is what selects development
# boot, where the boot ROM waits for a debugger instead of starting an image,
# and it is the only state in which the flash can be reached this way. The
# board will not run what was just written until BOOT1 goes back down and it
# is reset: the boot ROM decides from the pins and nothing else, and ST say
# that decision is not reachable from software, so there is no command to end
# a programming session with that would take its place.
#
# An image the boot ROM will accept is one that has been through
# STM32_SigningTool_CLI. What is written here is passed through untouched, so
# a plain binary lands in the flash exactly as given and is then refused at
# boot, BOOT1 notwithstanding.
